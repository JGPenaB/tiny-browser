<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Layout test</title>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 16px; }
  .row { height: 50px; }
  .ok { color: #1a7f37; } .bad { color: #c5221f; font-weight: bold; }
</style>
</head>
<body>
<!-- First on the page and tall, so that a wheel event sent to the middle of the window lands on it. -->
<div id="wheelBox" style="height: 400px; overflow: auto; background: #f4f4f4">
  <div class="row">wheel 1</div><div class="row">wheel 2</div><div class="row">wheel 3</div><div class="row">wheel 4</div><div class="row">wheel 5</div>
  <div class="row">wheel 6</div><div class="row">wheel 7</div><div class="row">wheel 8</div><div class="row">wheel 9</div><div class="row">wheel 10</div>
</div>

<!-- CSS 2 section 10.7: max-height holds the box whatever its overflow, and min-height wins over max-height -->
<div id="capped" style="max-height: 60px; background: #eef"><div class="row">a</div><div class="row">b</div><div class="row">c</div></div>
<div id="afterCapped" style="margin-top: 100px">after the capped box</div>
<div id="minWins" style="max-height: 40px; min-height: 70px; background: #efe"><div class="row">a</div></div>
<div id="borderBoxCap" style="box-sizing: border-box; max-height: 60px; padding: 10px; overflow: hidden"><div class="row">a</div><div class="row">b</div></div>

<!-- Flexbox 9.7: a column container whose height is capped or definite shrinks the items that can shrink -->
<div id="column" style="display: flex; flex-direction: column; max-height: 200px; width: 300px; background: #fee">
  <div id="head" style="height: 40px"><div style="height: 10px"></div></div>
  <div id="scroller" style="overflow: auto"><div class="row" id="firstRow">1</div><div class="row">2</div><div class="row">3</div><div class="row">4</div><div class="row">5</div><div class="row">6</div></div>
  <div id="foot" style="height: 60px"><div style="height: 10px"></div></div>
</div>
<!-- 300px of items in 120px: `rigid` does not shrink, `softer` gives up everything, `soft` stops at its content -->
<div id="fixedColumn" style="display: flex; flex-direction: column; height: 120px; width: 300px; margin-bottom: 40px">
  <div id="rigid" style="flex-shrink: 0; overflow: hidden"><div class="row">r</div><div class="row">r</div></div>
  <div id="soft" style="height: 100px"><div class="row">s</div></div>
  <div id="softer" style="overflow: hidden; flex-shrink: 3"><div class="row">t</div><div class="row">t</div></div>
</div>
<div id="roomy" style="display: flex; flex-direction: column; max-height: 500px; width: 300px">
  <div id="roomyItem" style="overflow: auto"><div class="row">fits</div></div>
</div>

<!-- Flexbox 9.9: a container is as wide as its items' contents. A flex-basis counts only as a cap for an item that
     cannot grow and as a floor for one that cannot shrink. -->
<div><div id="hug" style="display: inline-flex; background: #eef">
  <div id="grower" style="flex: 1"><div style="width: 80px; height: 10px"></div></div>
  <div id="rigid30" style="flex: 0 0 30px; height: 10px"></div>
  <div id="capped20" style="flex: 0 1 20px; min-width: 0"><div style="width: 50px; height: 10px"></div></div>
</div></div>

<div id="results"><b>Results</b></div>
<script>
  var pass = 0, fail = 0;
  var results = document.getElementById('results');
  function log(name, ok, detail) {
    ok ? pass++ : fail++;
    var row = document.createElement('div');
    row.className = ok ? 'ok' : 'bad';
    row.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' (' + detail + ')' : '');
    results.appendChild(row);
    console.log(row.textContent);
  }
  function eq(name, actual, expected) { log(name, actual === expected, actual === expected ? '' : 'got ' + JSON.stringify(actual) + ', want ' + JSON.stringify(expected)); }
  var $ = function (id) { return document.getElementById(id); };
  // Rounded to a hundredth of a pixel: positions are kept as floats and their differences are not exact.
  var px = function (v) { return Math.round(v * 100) / 100; };
  var heightOf = function (id) { return px($(id).getBoundingClientRect().height); };
  var topOf = function (id) { return px($(id).getBoundingClientRect().top); };

  // ---- max-height and min-height
  eq('max-height holds a box with visible overflow', heightOf('capped'), 60);
  eq('what follows starts at the capped edge', px(topOf('afterCapped') - topOf('capped')), 160);
  eq('min-height wins over max-height', heightOf('minWins'), 70);
  eq('max-height of a border-box includes its padding', heightOf('borderBoxCap'), 60);

  // ---- column flex containers
  eq('capped column: items shrink in proportion to their size', [heightOf('column'), heightOf('head'), heightOf('scroller'), heightOf('foot')].join(), '200,20,150,30');
  eq('capped column: the item after the shrunk ones moves up', px(topOf('foot') - topOf('column')), 170);
  eq('definite column: each item stops at its minimum', [heightOf('fixedColumn'), heightOf('rigid'), heightOf('soft'), heightOf('softer')].join(), '120,100,50,0');
  eq('a column with room to spare shrinks nothing', [heightOf('roomy'), heightOf('roomyItem')].join(), '50,50');

  var widthOf = function (id) { return px($(id).getBoundingClientRect().width); };
  eq('a flex container is as wide as its items need', [widthOf('hug'), widthOf('grower'), widthOf('rigid30'), widthOf('capped20')].join(), '130,80,30,20');

  // ---- scrolling inside a box
  var scroller = $('scroller');
  eq('scrollHeight and clientHeight', [scroller.scrollHeight, scroller.clientHeight, scroller.scrollTop].join(), '300,150,0');
  scroller.scrollTop = 50;
  eq('scrollTop moves the content', [px(scroller.scrollTop), px(topOf('firstRow') - topOf('scroller')), heightOf('scroller')].join(), '50,-50,150');
  scroller.scrollTop = 1000;
  eq('scrollTop stops at the end', px(scroller.scrollTop), 150);
  scroller.scrollTop = -5;
  eq('scrollTop stops at the start', scroller.scrollTop, 0);
  $('capped').scrollTop = 30;
  eq('a box with visible overflow does not scroll', $('capped').scrollTop, 0);
  var scrollEvents = [];
  scroller.addEventListener('scroll', function (e) { scrollEvents.push(e.target.id + ':' + e.bubbles + ':' + scroller.scrollTop); });
  scroller.scrollTop = 20;
  eq('the scroll event is not fired from inside the setter', scrollEvents.length, 0);
  setTimeout(function () { eq('the scroll event is fired at the element and does not bubble', scrollEvents.join(), 'scroller:false:20'); }, 20);

  // After the summary the test runner sends this box a wheel event and two clicks: one where a row can be seen and
  // one just above the box, where a row that was scrolled out of view lies. See the README for the command.
  $('wheelBox').addEventListener('scroll', function () { console.log('WHEEL ' + this.scrollTop + ' of ' + (this.scrollHeight - this.clientHeight)); });
  $('wheelBox').addEventListener('click', function (e) { console.log('CLICK ' + e.target.textContent); });

  window.addEventListener('load', function () {
    setTimeout(function () {
      document.title = 'Layout test: ' + pass + ' passed, ' + fail + ' failed';
      console.log('SUMMARY ' + pass + ' passed, ' + fail + ' failed');
    }, 80);
  });
</script>
</body>
</html>
