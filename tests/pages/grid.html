<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grid test</title>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 16px; font-size: 16px; line-height: 20px; }
  .ok { color: #1a7f37; } .bad { color: #c5221f; font-weight: bold; }
  /* CSS Grid 1. Each case is a grid 400px wide; the items' places are measured from the grid's top left */
  .g { display: grid; width: 400px; background: #eee; margin-bottom: 20px; }
  .g > * { background: #8af; }
  .h20 > * { height: 20px; }
  #fr { grid-template-columns: 100px 1fr 2fr; column-gap: 10px; }
  #flow { grid-template-columns: repeat(3, 1fr); gap: 10px 20px; }
  #span { grid-template-columns: repeat(4, 100px); }
  #span .a { grid-column: span 2; } #span .b { grid-column: 2 / 4; } #span .c { grid-column: 1 / -1; } #span .d { grid-row: 1 / 3; grid-column: 4; }
  #areas { grid-template: "head head" 30px "side main" 50px "foot foot" 20px / 100px 1fr; }
  #areas .head { grid-area: head; } #areas .side { grid-area: side; } #areas .main { grid-area: main; } #areas .foot { grid-area: foot; }
  #fill { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  #fit { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
  #implicit { grid-template-columns: 100px 100px; grid-auto-rows: 50px; }
  #implicit > * { height: auto; }
  #colflow { grid-template-rows: 20px 20px; grid-auto-flow: column; grid-auto-columns: 50px; }
  #dense { grid-template-columns: repeat(3, 100px); grid-auto-flow: row dense; }
  #dense .wide { grid-column: span 2; }
  #content { grid-template-columns: auto auto; }
  #content > * { height: auto; }
  #justify { grid-template-columns: 200px 200px; justify-items: center; align-items: end; grid-auto-rows: 60px; }
  #justify > * { height: auto; }
  #justify .self { justify-self: end; align-self: start; }
  #minh { min-height: 200px; grid-template-rows: auto 1fr auto; }
  #minh > * { height: auto; }
  #inline { display: inline-grid; width: auto; grid-template-columns: 50px 70px; }
  #names { grid-template-columns: [a] 100px [b] 100px [c] 100px [d]; }
  #names .x { grid-column: b / d; } #names .y { grid-column: a / span 1; }
  #pct { grid-template-columns: 25% 75%; }
  #center { height: 100px; grid-template-columns: 100px 100px; grid-template-rows: 30px; justify-content: center; align-content: center; }
  #margins { grid-template-columns: 200px; grid-auto-rows: 60px; }
  #margins > * { width: 50px; height: 20px; margin: auto; }
  #negative { grid-template-columns: 100px 100px 100px; }
  #negative .z { grid-column: -2; grid-row: 2; }
</style>
</head>
<body>
<div class="g h20" id="fr"><div id="fr1"></div><div id="fr2"></div><div id="fr3"></div></div>
<div class="g h20" id="flow"><div></div><div></div><div></div><div id="flow4"></div><div id="flow5"></div></div>
<div class="g h20" id="span"><div class="a" id="sa"></div><div class="b" id="sb"></div><div class="c" id="sc"></div><div class="d" id="sd"></div></div>
<div class="g" id="areas"><div class="foot" id="foot"></div><div class="main" id="main"></div><div class="side" id="side"></div><div class="head" id="head"></div></div>
<div class="g h20" id="fill"><div id="fill1"></div><div id="fill2"></div></div>
<div class="g h20" id="fit"><div id="fit1"></div><div id="fit2"></div></div>
<div class="g" id="implicit"><div></div><div></div><div id="imp3"></div></div>
<div class="g" id="colflow"><div></div><div></div><div id="cf3"></div></div>
<div class="g h20" id="dense"><div class="wide" id="d1"></div><div class="wide" id="d2"></div><div id="d3"></div></div>
<div class="g" id="content"><div id="ct1">short</div><div id="ct2">a little longer</div></div>
<div class="g" id="justify"><div id="j1">ab</div><div class="self" id="j2">ab</div></div>
<div class="g" id="minh"><div id="mh1">top</div><div id="mh2">middle</div><div id="mh3">bottom</div></div>
<div class="g h20" id="inline"><div></div><div></div></div>
<div class="g h20" id="names"><div class="x" id="nx"></div><div class="y" id="ny"></div></div>
<div class="g h20" id="pct"><div id="p1"></div><div id="p2"></div></div>
<div class="g" id="center"><div id="cc1"></div><div></div></div>
<div class="g" id="margins"><div id="mg"></div></div>
<div class="g h20" id="negative"><div class="z" id="z"></div></div>
<div id="results"></div>
<script>
  var pass = 0, fail = 0;
  var results = document.getElementById('results');
  function log(name, ok, detail) {
    ok ? pass++ : fail++;
    var row = document.createElement('div');
    row.className = ok ? 'ok' : 'bad';
    row.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' (' + detail + ')' : '');
    results.appendChild(row);
    console.log(row.textContent);
  }
  function eq(name, actual, expected) { log(name, actual === expected, actual === expected ? '' : 'got ' + JSON.stringify(actual) + ', want ' + JSON.stringify(expected)); }
  var $ = function (id) { return document.getElementById(id); };
  var R = function (id) { return $(id).getBoundingClientRect(); };
  // left,top,width,height relative to the grid the element is in, rounded
  function box(id) {
    var r = R(id), g = $(id).parentNode.getBoundingClientRect();
    return [r.left - g.left, r.top - g.top, r.width, r.height].map(Math.round).join();
  }

  eq('fixed and fr columns share what is left after the gaps', [box('fr1'), box('fr2'), box('fr3')].join(' '), '0,0,100,20 110,0,93,20 213,0,187,20');
  eq('auto-placement goes on in the next row, with row and column gaps', [box('flow4'), box('flow5')].join(' '), '0,30,120,20 140,30,120,20');
  eq('spans and line numbers, negative ones from the end', [box('sa'), box('sb'), box('sc'), box('sd')].join(' '), '0,0,200,20 100,20,200,20 0,40,400,20 300,0,100,20');
  eq('named areas from grid-template', [box('head'), box('side'), box('main'), box('foot')].join(' '), '0,0,400,30 0,30,100,50 100,30,300,50 0,80,400,20');
  eq('repeat(auto-fill) makes as many columns as fit', [box('fill1'), box('fill2')].join(' '), '0,0,127,20 137,0,127,20');
  eq('repeat(auto-fit) lets the empty ones collapse', [box('fit1'), box('fit2')].join(' '), '0,0,195,20 205,0,195,20');
  eq('grid-auto-rows sizes the rows auto-placement adds', box('imp3'), '0,50,100,50');
  eq('grid-auto-flow: column fills columns first', box('cf3'), '50,0,50,20');
  eq('dense packing: a later item goes back to fill a hole', [box('d1'), box('d2'), box('d3')].join(' '), '0,0,200,20 0,20,200,20 200,0,100,20');
  log('auto columns are as wide as their content wants, and share the rest', R('ct2').width > R('ct1').width && Math.round(R('ct1').width + R('ct2').width) === 400, box('ct1') + ' ' + box('ct2'));
  eq('justify-items and align-items, and the self ones', [box('j1').split(',').slice(1, 2).join(), box('j2').split(',').slice(1, 2).join(), Math.round(R('j1').left - R('justify').left + R('j1').width / 2), Math.round(R('j2').right - R('justify').left)].join(), '40,0,100,400');
  eq('a 1fr row takes what min-height leaves', [box('mh1').split(',')[1], box('mh2').split(',')[1], box('mh3').split(',')[1], Math.round(R('minh').height)].join(), '0,20,180,200');
  eq('an inline grid is as wide as its columns', Math.round(R('inline').width), 120);
  eq('named lines', [box('nx'), box('ny')].join(' '), '100,0,200,20 0,20,100,20');
  eq('percentage tracks', [box('p1'), box('p2')].join(' '), '0,0,100,20 100,0,300,20');
  eq('justify-content and align-content center the tracks', box('cc1'), '100,35,100,30');
  eq('auto margins centre an item in its area', box('mg'), '75,20,50,20');
  eq('a negative line on its own; an empty auto row has no height', box('z'), '200,0,100,20');

  window.addEventListener('load', function () {
    document.title = 'Grid test: ' + pass + ' passed, ' + fail + ' failed';
    console.log('SUMMARY ' + pass + ' passed, ' + fail + ' failed');
  });
</script>
</body>
</html>
