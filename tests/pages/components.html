<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Components test</title>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 16px; }
  .card { border: 1px solid #c8ccd4; border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
  .ok { color: #1a7f37; } .bad { color: #c5221f; font-weight: bold; }
  x-late:not(:defined) { display: none; }
  .inner { color: rgb(1, 2, 3); }
  #sh1 span { color: rgb(9, 9, 9); }
</style>
</head>
<body>
<h1>Templates, custom elements, shadow DOM</h1>
<template id="tpl"><title>not the page title</title><p class="row" id="in-template">row <b>bold</b></p><template id="inner"><i>deep</i></template></template>
<template id="rows"><tr><td>cell</td></tr></template>
<x-greet id="g1" name="A">first</x-greet> <x-greet name="B">second</x-greet> <x-late>late</x-late>
<div id="slot"></div>
<div id="sh1"><span slot="title">Slotted title</span><b>default one</b> text <i slot="none">unassigned</i></div>
<div id="sh2">hidden light text</div>
<div class="card" id="results"><b>Results</b></div>
<script>
  var pass = 0, fail = 0;
  var results = document.getElementById('results');
  function log(name, ok, detail) {
    ok ? pass++ : fail++;
    var row = document.createElement('div');
    row.className = ok ? 'ok' : 'bad';
    row.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' (' + detail + ')' : '');
    results.appendChild(row);
    console.log((ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' (' + detail + ')' : ''));
  }
  function eq(name, actual, expected) { log(name, actual === expected, actual === expected ? '' : 'got ' + JSON.stringify(actual) + ', want ' + JSON.stringify(expected)); }

  // ---- template contents are a fragment of their own, not part of the page (HTML 4.12.3)
  var tpl = document.getElementById('tpl');
  eq('template: no children', tpl.childNodes.length + ':' + tpl.children.length, '0:0');
  eq('template: content is a fragment', tpl.content.nodeType + ':' + tpl.content.childNodes.length + ':' + (tpl.content === tpl.content), '11:3:true');
  eq('template: contents are not in the document', String(document.getElementById('in-template')) + document.querySelectorAll('.row').length + document.title, 'null0Components test');
  eq('template: found through content', tpl.content.querySelector('.row b').textContent + tpl.content.getElementById('in-template').className, 'boldrow');
  var rows = document.getElementById('rows').content;
  eq('template: table rows on their own', rows.firstChild.tagName + rows.querySelector('td').textContent, 'TRcell');
  eq('template: nested', tpl.content.querySelector('#inner').content.firstChild.outerHTML, '<i>deep</i>');
  eq('template: innerHTML reads the contents', tpl.innerHTML.indexOf('<p class="row" id="in-template">row <b>bold</b></p>') > 0, true);
  var copy = tpl.cloneNode(true), shallow = tpl.cloneNode(false);
  eq('template: deep clone copies contents', copy.content.childNodes.length + ':' + (copy.content !== tpl.content) + ':' + copy.content.querySelector('#inner').content.childNodes.length, '3:true:1');
  eq('template: shallow clone has empty contents', shallow.content.childNodes.length, 0);
  var made = document.createElement('template');
  made.innerHTML = '<span>a</span><span>b</span>';
  eq('template: innerHTML writes the contents', made.childNodes.length + ':' + made.content.childNodes.length + ':' + made.innerHTML, '0:2:<span>a</span><span>b</span>');
  var stamp = document.importNode(made.content, true);
  var host = document.createElement('div');
  host.appendChild(stamp);
  eq('template: stamping a copy', host.innerHTML + made.content.childNodes.length, '<span>a</span><span>b</span>2');
  host.appendChild(made.content);
  eq('template: moving the contents', host.children.length + ':' + made.content.childNodes.length, '4:0');
  made.appendChild(document.createElement('u'));
  eq('template: children are not contents', made.childNodes.length + ':' + made.content.childNodes.length + ':' + made.outerHTML, '1:0:<template></template>');

  // ---- custom elements (HTML 4.13)
  var trace = [];
  class Greet extends HTMLElement {
    static get observedAttributes() { return ['name', 'class', 'data-x', 'style', 'hidden']; }
    constructor() { super(); this.made = true; trace.push('ctor ' + (this.getAttribute('name') || '-')); }
    connectedCallback() { trace.push('in ' + (this.getAttribute('name') || '-')); }
    disconnectedCallback() { trace.push('out ' + (this.getAttribute('name') || '-')); }
    attributeChangedCallback(name, was, now, ns) { trace.push(name + ':' + was + '>' + now + (ns === null ? '' : '!')); }
    hello() { return 'hello ' + this.getAttribute('name'); }
  }
  function taken() { var t = trace.join(' | '); trace.length = 0; return t; }
  var first = document.getElementById('g1'), late = document.querySelector('x-late');
  eq('custom: before define', (first instanceof HTMLElement) + ':' + first.matches(':defined') + ':' + typeof first.hello + ':' + String(customElements.get('x-greet')), 'true:false:undefined:undefined');
  eq('custom: :not(:defined) styles apply', getComputedStyle(late).display, 'none');
  var whenGreet = customElements.whenDefined('x-greet');
  customElements.define('x-greet', Greet);
  eq('custom: upgrades run in document order', taken(), 'ctor A | name:null>A | in A | ctor B | name:null>B | in B');
  eq('custom: upgraded element', first.hello() + ':' + first.made + ':' + (first instanceof Greet) + ':' + first.matches(':defined') + ':' + (first.constructor === Greet), 'hello A:true:true:true:true');
  eq('custom: registry lookups', (customElements.get('x-greet') === Greet) + ':' + customElements.getName(Greet) + ':' + String(customElements.get('x-none')) + ':' + customElements.getName(Object), 'true:x-greet:undefined:null');
  whenGreet.then(function (c) { log('custom: whenDefined resolves with the constructor', c === Greet); });
  customElements.whenDefined('x-greet').then(function (c) { log('custom: whenDefined after the fact', c === Greet); });
  customElements.whenDefined('bad').then(null, function (e) { log('custom: whenDefined rejects a bad name', e.name === 'SyntaxError'); });
  function thrown(f) { try { f(); return 'none'; } catch (e) { return e.name; } }
  eq('custom: define refuses', [thrown(function () { customElements.define('nohyphen', class extends HTMLElement {}); }),
    thrown(function () { customElements.define('x-greet', class extends HTMLElement {}); }), thrown(function () { customElements.define('x-again', Greet); }),
    thrown(function () { customElements.define('x-arrow', function () {}.bind ? (() => 1) : null); }), thrown(function () { customElements.define('X-Upper', class extends HTMLElement {}); })].join(),
    'SyntaxError,NotSupportedError,NotSupportedError,TypeError,SyntaxError');
  eq('custom: HTMLElement alone is not constructible', thrown(function () { new HTMLElement(); }) + ':' + thrown(function () { new (class extends HTMLElement {})(); }) + ':' + thrown(function () { HTMLElement(); }), 'TypeError:TypeError:TypeError');
  var made1 = new Greet(), made2 = document.createElement('x-greet');
  eq('custom: new and createElement construct at once', taken() + ' / ' + made1.localName + ':' + made2.hello() + ':' + (made2 instanceof Greet) + ':' + made1.isConnected, 'ctor - | ctor - / x-greet:hello null:true:false');
  made1.setAttribute('name', 'C'); made1.setAttribute('name', 'C2'); made1.setAttribute('other', 'x'); made1.removeAttribute('name'); made1.toggleAttribute('hidden');
  made1.className = 'k'; made1.classList.add('m'); made1.dataset.x = '1'; delete made1.dataset.x; made1.style.color = 'red'; made1.id = 'not-watched';
  eq('custom: attribute changes', taken(), 'name:null>C | name:C>C2 | name:C2>null | hidden:null> | class:null>k | class:k>k m | data-x:null>1 | data-x:1>null | style:null>color: red;');
  made1.setAttribute('name', 'C'); taken();
  var slot = document.getElementById('slot');
  slot.appendChild(made1);
  eq('custom: connected', taken(), 'in C');
  document.body.appendChild(made1);
  eq('custom: moved', taken(), 'out C | in C');
  made1.remove(); made1.remove();
  eq('custom: disconnected once', taken(), 'out C');
  var frag = document.createDocumentFragment(), fa = new Greet(), fb = new Greet();
  fa.setAttribute('name', 'F1'); fb.setAttribute('name', 'F2'); frag.append(fa, document.createElement('p'), fb); taken();
  slot.appendChild(frag);
  eq('custom: a fragment connects all, then calls', taken(), 'in F1 | in F2');
  slot.innerHTML = '<x-greet name="H"><x-greet name="H2"></x-greet></x-greet>';
  eq('custom: innerHTML in the document', taken(), 'ctor H | name:null>H | in H | ctor H2 | name:null>H2 | in H2 | out F1 | out F2');
  var loose = document.createElement('div'), inert = document.createElement('template'), early = document.createElement('x-early');
  loose.innerHTML = '<x-greet name="L"></x-greet>';
  inert.innerHTML = '<x-greet name="T"></x-greet>';
  eq('custom: innerHTML upgrades outside the document, but not in a template', taken() + ':' + typeof loose.firstChild.hello + ':' + typeof inert.content.firstChild.hello, 'ctor L | name:null>L:function:undefined');
  loose.appendChild(early);
  customElements.define('x-early', class extends HTMLElement { constructor() { super(); trace.push('early'); } });
  eq('custom: define leaves detached elements alone', taken() + ':' + early.matches(':defined'), ':false');
  customElements.upgrade(loose);
  eq('custom: upgrade() of a detached tree', taken() + ':' + early.matches(':defined'), 'early:true');
  var cloned = slot.firstChild.cloneNode(true);
  eq('custom: clones are upgraded', taken() + ':' + (cloned instanceof Greet) + ':' + cloned.firstChild.hello(), 'ctor H | name:null>H | ctor H2 | name:null>H2:true:hello H2');
  slot.replaceChildren();
  eq('custom: replaceChildren disconnects', taken(), 'out H | out H2');
  class Inner extends HTMLElement { connectedCallback() { trace.push('inner in'); this.textContent = 'filled'; } }
  class Outer extends HTMLElement { connectedCallback() { trace.push('outer in'); this.appendChild(document.createElement('x-inner')); trace.push('outer done'); } }
  customElements.define('x-inner', Inner); customElements.define('x-outer', Outer);
  slot.appendChild(document.createElement('x-outer'));
  eq('custom: reactions inside a reaction', taken() + ':' + slot.textContent, 'outer in | inner in | outer done:filled');
  customElements.define('x-late', class extends HTMLElement { constructor() { super(); trace.push('late'); } });
  eq('custom: late definition', taken() + ':' + late.matches(':defined') + ':' + getComputedStyle(late).display, 'late:true:inline');
  var order = [];
  class Counted extends HTMLElement { static get observedAttributes() { order.push('observed'); return []; } }
  var watching = new Proxy(Counted, { get: function (t, k, r) { if (typeof k === 'string') order.push(k); return Reflect.get(t, k, r); } });
  customElements.define('x-counted', watching);
  eq('custom: what define reads from the constructor', order.join(), 'prototype,disabledFeatures,formAssociated');

  // ---- shadow trees (DOM 4.8, CSS Scoping)
  var sh1 = document.getElementById('sh1'), root = sh1.attachShadow({ mode: 'open' });
  root.innerHTML = '<style>:host { display: block; border-left: 4px solid rgb(0, 128, 0); } .inner { font-weight: 700; } ::slotted(span) { font-style: italic; }' +
    ' :host(.wide) .inner { font-style: italic; } #sh1 { margin-top: 99px; }</style>' +
    '<p class="inner"><slot name="title">fallback title</slot></p><div id="body"><slot></slot></div><slot name="empty"><em id="fb">fallback</em></slot>';
  var inner = root.querySelector('.inner'), span = sh1.querySelector('span'), bold = sh1.querySelector('b'), unassigned = sh1.querySelector('i');
  var slots = root.querySelectorAll('slot');
  eq('shadow: root', (sh1.shadowRoot === root) + ':' + (root.host === sh1) + ':' + root.mode + ':' + root.nodeType + ':' + String(root.parentNode) + ':' + (root instanceof ShadowRoot) + ':' + (root instanceof DocumentFragment), 'true:true:open:11:null:true:true');
  eq('shadow: roots of nodes', (inner.getRootNode() === root) + ':' + (inner.getRootNode({ composed: true }) === document) + ':' + (span.getRootNode() === document) + ':' + inner.isConnected + ':' + (inner.parentNode === root), 'true:true:true:true:true');
  eq('shadow: the tree is its own', String(document.querySelector('.inner')) + ':' + String(document.getElementById('body')) + ':' + root.querySelector('#body').tagName + ':' + sh1.children.length + ':' + root.children.length, 'null:null:DIV:3:4');
  eq('shadow: slot assignment', slots[0].assignedNodes().length + ':' + slots[0].assignedElements()[0].textContent + ':' + slots[1].assignedNodes().length + ':' + slots[1].assignedElements().length + ':' +
    (span.assignedSlot === slots[0]) + ':' + String(unassigned.assignedSlot) + ':' + slots[2].assignedNodes().length + ':' + slots[2].assignedNodes({ flatten: true }).length, '1:Slotted title:2:1:true:null:0:1');
  var cs = function (el, prop) { return getComputedStyle(el)[prop]; };
  eq('shadow: its styles stay inside', cs(inner, 'fontWeight') + ':' + (cs(inner, 'color') !== 'rgb(1, 2, 3)') + ':' + cs(sh1, 'marginTop'), '700:true:0px');
  eq('shadow: :host and ::slotted', cs(sh1, 'display') + ':' + cs(sh1, 'borderLeftWidth') + ':' + cs(span, 'fontStyle') + ':' + cs(span, 'color'), 'block:4px:italic:rgb(9, 9, 9)');
  sh1.className = 'wide';
  eq('shadow: :host() with a selector', cs(inner, 'fontStyle'), 'italic');
  var box = function (el) { return el.getBoundingClientRect(); };
  eq('shadow: the flat tree is what is laid out', (box(unassigned).width === 0) + ':' + (box(bold).width > 0) + ':' + (box(root.getElementById('fb')).width > 0) + ':' + (box(span).top < box(bold).top) + ':' + (box(inner).height > 0), 'true:true:true:true:true');
  eq('shadow: refusals', [thrown(function () { sh1.attachShadow({ mode: 'open' }); }), thrown(function () { document.createElement('a').attachShadow({ mode: 'open' }); }),
    thrown(function () { document.createElement('div').attachShadow({}); }), thrown(function () { document.createElement('div').attachShadow(); })].join(), 'NotSupportedError,NotSupportedError,TypeError,TypeError');
  var sh2 = document.getElementById('sh2'), closedRoot = sh2.attachShadow({ mode: 'closed' });
  closedRoot.innerHTML = '<u>shadow only</u>';
  eq('shadow: closed', String(sh2.shadowRoot) + ':' + closedRoot.mode + ':' + (closedRoot.firstChild.getRootNode() === closedRoot) + ':' + (box(closedRoot.firstChild).width > 0), 'null:closed:true:true');
  function depthOf(el) { var n = 0; while (el.parentNode) { el = el.parentNode; n++; } return n; }
  var seen = [];
  var note = function (who) { return function (e) { seen.push(who + '=' + (e.target === inner ? 'inner' : e.target === sh1 ? 'host' : '?') + (who === 'inner' ? '/' + e.composedPath().length : '')); }; };
  inner.addEventListener('ping', note('inner')); root.addEventListener('ping', note('root')); sh1.addEventListener('ping', note('host')); document.addEventListener('ping', note('doc'));
  inner.dispatchEvent(new Event('ping', { bubbles: true, composed: true }));
  seen.push('|');
  inner.dispatchEvent(new Event('ping', { bubbles: true }));
  eq('shadow: events are retargeted, and stay inside unless composed', seen.join(' '), 'inner=inner/' + (4 + depthOf(sh1)) + ' root=inner host=host doc=host | inner=inner/2 root=inner');
  root.appendChild(document.createElement('x-greet')).setAttribute('name', 'S'); taken();
  sh1.remove(); document.body.insertBefore(sh1, results);
  eq('shadow: custom elements inside follow the host', taken(), 'out S | in S');
  class Card extends HTMLElement { constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<style>:host { display: inline-block; }</style>[<slot></slot>]'; } }
  customElements.define('x-card', Card);
  var card = document.createElement('x-card');
  card.textContent = 'card';
  slot.appendChild(card);
  eq('shadow: a custom element with its own tree', cs(card, 'display') + ':' + card.shadowRoot.childNodes.length + ':' + (box(card).width > 0) + ':' + card.outerHTML, 'inline-block:4:true:<x-card>card</x-card>');
  class NoShadow extends HTMLElement { static get disabledFeatures() { return ['shadow']; } }
  customElements.define('x-noshadow', NoShadow);
  eq('shadow: disabledFeatures', thrown(function () { new NoShadow().attachShadow({ mode: 'open' }); }), 'NotSupportedError');

  window.addEventListener('load', function () {
    setTimeout(function () {
      document.title = 'Components test: ' + pass + ' passed, ' + fail + ' failed';
      console.log('SUMMARY ' + pass + ' passed, ' + fail + ' failed');
    }, 80);
  });
</script>
</body>
</html>
