<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DOM test</title>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 16px; }
  .card { border: 1px solid #c8ccd4; border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
  .ok { color: #1a7f37; } .bad { color: #c5221f; font-weight: bold; }
  .hidden { display: none; }
  #list li.done { text-decoration: line-through; color: #777; }
  button { padding: 6px 12px; }
</style>
</head>
<body>
<h1 id="title">Static title</h1>
<noscript><p class="bad">noscript content must be hidden when scripts run</p></noscript>
<ul id="list"><li>one</li><li class="done">two</li><li>three</li></ul>
<div class="card">
  <button id="btn" type="button">Clicked 0 times</button>
  <button id="inline" type="button" onclick="this.textContent = 'inline handler ran'; log('inline', true)">Inline handler</button>
  <a id="link" href="https://example.com/">cancelled link</a>
  <input id="field" type="text" value="start">
  <span id="echo"></span>
  <label><input id="check" type="checkbox"> tick me</label>
  <form id="form" action="/nowhere"><input name="q" value="x"><button id="submit">Submit</button></form>
</div>
<div id="box" style="width: 120px; height: 40px; background: #dde6f7">box</div>
<div class="card" id="results"><b>Results</b></div>
<script>
  var pass = 0, fail = 0;
  var results = document.getElementById('results');
  function log(name, ok, detail) {
    ok ? pass++ : fail++;
    var row = document.createElement('div');
    row.className = ok ? 'ok' : 'bad';
    row.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' (' + detail + ')' : '');
    results.appendChild(row);
    console.log((ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' (' + detail + ')' : ''));
  }
  function eq(name, actual, expected) { log(name, actual === expected, actual === expected ? '' : 'got ' + JSON.stringify(actual) + ', want ' + JSON.stringify(expected)); }

  // ---- reading the tree
  eq('document.title', document.title, 'DOM test');
  eq('getElementById', document.getElementById('title').textContent, 'Static title');
  eq('tagName', document.body.tagName, 'BODY');
  eq('querySelectorAll', document.querySelectorAll('#list li').length, 3);
  eq('querySelector class', document.querySelector('li.done').textContent, 'two');
  eq('children', document.getElementById('list').children.length, 3);
  eq('firstElementChild', document.getElementById('list').firstElementChild.textContent, 'one');
  eq('nextElementSibling', document.querySelector('li.done').nextElementSibling.textContent, 'three');
  eq('parentNode', document.querySelector('li').parentNode.id, 'list');
  eq('closest', document.querySelector('li').closest('ul').id, 'list');
  eq('matches', document.querySelector('li.done').matches('ul > li.done'), true);
  eq('wrapper identity', document.body === document.body && document.querySelector('#title') === document.getElementById('title'), true);
  eq('instanceof', document.body instanceof HTMLElement && document.body instanceof Node && document instanceof Document, true);
  eq('nodeType', [document.nodeType, document.body.nodeType, document.body.firstChild.nodeType].join(), '9,1,3');
  eq('getElementsByTagName', document.getElementsByTagName('li').length, 3);
  eq('getElementsByClassName', document.getElementsByClassName('card').length, 2);
  eq('readyState while loading', document.readyState, 'loading');
  eq('currentScript', document.currentScript.tagName, 'SCRIPT');

  // ---- changing the tree
  document.getElementById('title').textContent = 'Title set by script';
  var list = document.getElementById('list');
  var li = document.createElement('li');
  li.textContent = 'four (added)';
  li.setAttribute('data-kind', 'new');
  list.appendChild(li);
  eq('appendChild', list.children.length, 4);
  eq('dataset', li.dataset.kind, 'new');
  li.dataset.userId = '42';
  eq('dataset write', li.getAttribute('data-user-id'), '42');
  list.insertBefore(document.createElement('li'), list.firstChild).textContent = 'zero (inserted first)';
  eq('insertBefore', list.firstElementChild.textContent, 'zero (inserted first)');
  list.removeChild(list.querySelector('.done'));
  eq('removeChild', list.querySelectorAll('.done').length, 0);
  li.classList.add('done', 'extra'); li.classList.toggle('extra');
  eq('classList', li.className, 'done');
  eq('classList.contains', li.classList.contains('done'), true);
  var holder = document.createElement('div');
  holder.innerHTML = '<p class="x">para <b>bold</b></p><span>tail</span>';
  eq('innerHTML set', holder.children.length + ':' + holder.querySelector('b').textContent, '2:bold');
  eq('innerHTML get', holder.innerHTML, '<p class="x">para <b>bold</b></p><span>tail</span>');
  eq('outerHTML', holder.firstChild.lastChild.outerHTML, '<b>bold</b>');
  holder.className = 'card';
  document.body.appendChild(holder);
  eq('isConnected', holder.isConnected, true);
  var frag = document.createDocumentFragment();
  for (var i = 0; i < 3; i++) { var s = document.createElement('span'); s.textContent = '[' + i + ']'; frag.appendChild(s); }
  holder.appendChild(frag);
  eq('fragment', holder.querySelectorAll('span').length, 4);
  holder.insertAdjacentHTML('beforeend', '<em>adjacent</em>');
  eq('insertAdjacentHTML', holder.lastElementChild.tagName, 'EM');
  var clone = holder.cloneNode(true);
  eq('cloneNode', clone.querySelectorAll('span').length + ':' + (clone !== holder), '4:true');
  holder.querySelector('p').remove();
  eq('remove', holder.querySelector('p'), null);
  holder.append('text via append ', document.createElement('i'));
  eq('append', holder.lastChild.tagName, 'I');

  // ---- style and layout
  var box = document.getElementById('box');
  eq('style read', box.style.width, '120px');
  box.style.backgroundColor = 'rgb(200, 240, 200)';
  box.style.width = '200px';
  eq('style write', box.getAttribute('style').indexOf('background-color: rgb(200, 240, 200)') >= 0, true);
  eq('offsetWidth after style change', box.offsetWidth, 200);
  eq('getBoundingClientRect', box.getBoundingClientRect().height, 40);
  eq('getComputedStyle', getComputedStyle(box).display, 'block');
  document.querySelector('noscript') && eq('noscript hidden', getComputedStyle(document.querySelector('noscript')).display, 'none');
  eq('innerWidth', innerWidth > 200 && innerWidth === window.innerWidth, true);

  // ---- events
  var clicks = 0, order = [];
  var btn = document.getElementById('btn');
  btn.addEventListener('click', function (e) { clicks++; this.textContent = 'Clicked ' + clicks + ' times'; order.push('target:' + e.target.id + ':' + e.eventPhase); });
  document.body.addEventListener('click', function (e) { order.push('bubble:' + e.currentTarget.tagName); });
  document.addEventListener('click', function (e) { order.push('capture'); }, true);
  btn.click();
  eq('click dispatch order', order.join(' '), 'capture target:btn:2 bubble:BODY');
  var custom = 0;
  document.addEventListener('thing', function (e) { custom = e.detail.n; });
  holder.dispatchEvent(new CustomEvent('thing', { bubbles: true, detail: { n: 7 } }));
  eq('CustomEvent bubbles', custom, 7);
  var once = 0; btn.addEventListener('x', function () { once++; }, { once: true });
  btn.dispatchEvent(new Event('x')); btn.dispatchEvent(new Event('x'));
  eq('once listener', once, 1);
  var stopped = 0; holder.addEventListener('y', function (e) { e.stopPropagation(); }); document.body.addEventListener('y', function () { stopped++; });
  holder.dispatchEvent(new Event('y', { bubbles: true }));
  eq('stopPropagation', stopped, 0);
  eq('preventDefault result', holder.dispatchEvent(new Event('z', { cancelable: true })), true);
  holder.addEventListener('z', function (e) { e.preventDefault(); });
  eq('preventDefault cancels', holder.dispatchEvent(new Event('z', { cancelable: true })), false);
  document.getElementById('link').addEventListener('click', function (e) { e.preventDefault(); this.textContent = 'link click was cancelled'; log('link click cancelled', true); });
  document.getElementById('field').addEventListener('input', function () { document.getElementById('echo').textContent = 'typed: ' + this.value; });
  document.getElementById('check').addEventListener('change', function () { log('checkbox change', this.checked === true); });
  document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); log('submit cancelled', true); });
  eq('input value', document.getElementById('field').value, 'start');

  // ---- timers, storage, window
  localStorage.setItem('k', 'v'); localStorage.other = 'w';
  eq('localStorage', localStorage.getItem('k') + localStorage.other + localStorage.length, 'vw2');
  eq('location', location.pathname.indexOf('dom.html') >= 0 && location.href === document.URL, true);
  eq('navigator', navigator.userAgent.indexOf('TinyBrowser') > 0, true);
  eq('atob/btoa', atob(btoa('hello')), 'hello');
  var ticks = 0;
  var iv = setInterval(function () { if (++ticks === 3) { clearInterval(iv); log('setInterval x3', true); } }, 10);
  setTimeout(function (a, b) { log('setTimeout args', a + b === 3); }, 20, 1, 2);
  Promise.resolve().then(function () { log('promise microtask', true); });
  requestAnimationFrame(function (t) { log('requestAnimationFrame', typeof t === 'number'); });
  document.addEventListener('DOMContentLoaded', function () { log('DOMContentLoaded', document.readyState === 'interactive'); });
  window.addEventListener('load', function () {
    log('load', document.readyState === 'complete');
    setTimeout(function () {
      document.title = 'DOM test: ' + pass + ' passed, ' + fail + ' failed';
      console.log('SUMMARY ' + pass + ' passed, ' + fail + ' failed');
    }, 80);
  });
</script>
</body>
</html>
